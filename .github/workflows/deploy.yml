name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /var/www &&
            sudo git -C wp-content/themes/gwill-tech-theme pull origin main &&
            sudo git -C wp-content/plugins/vibe-comments pull origin main &&
            sudo chown -R www-data:www-data wp-content/themes/gwill-tech-theme wp-content/plugins/vibe-comments &&
            sudo wp cache flush --allow-root --path=/var/www &&
            echo 'Deploy complete'
          "